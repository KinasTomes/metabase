name: metabot-poc

services:
  metabot-app-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${METABOT_APP_DB_NAME:-metabot}
      POSTGRES_USER: ${METABOT_APP_DB_USER:-metabot}
      POSTGRES_PASSWORD: ${METABOT_APP_DB_PASSWORD:?Set METABOT_APP_DB_PASSWORD in dev/metabot-poc/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - metabot_app_db:/var/lib/postgresql/data

  # BI warehouse. Separate from the app DB on purpose: Metabase connects to it
  # as a least-privilege reader that can only see the `analytics` schema, so a
  # misconfigured question cannot reach Silver or Gold.
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-bi_warehouse}
      POSTGRES_USER: ${WAREHOUSE_USER:-postgres}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD in dev/metabot-poc/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - metabot_warehouse:/var/lib/postgresql/data
    ports:
      # Exposed so load_warehouse.py can run from the host. 5433 avoids
      # clashing with a local Postgres or the bi-agent stack on 5432.
      - "${WAREHOUSE_HOST_PORT:-5433}:5432"

  metabase:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MB_EDITION: ee
        VERSION: ${METABOT_BUILD_VERSION:-v0.63.1.6-metabot-poc}
    image: metabase-metabot-poc:local
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabot-app-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABOT_APP_DB_NAME:-metabot}
      MB_DB_USER: ${METABOT_APP_DB_USER:-metabot}
      MB_DB_PASS: ${METABOT_APP_DB_PASSWORD:?Set METABOT_APP_DB_PASSWORD in dev/metabot-poc/.env}
      MB_JETTY_PORT: 3000
      MB_SITE_URL: ${METABOT_SITE_URL:-http://localhost:3000}
      MB_LOAD_SAMPLE_CONTENT: "false"
      MB_ANON_TRACKING_ENABLED: "false"
      MB_AI_FEATURES_ENABLED: "true"

      # Which provider and model Metabot talks to, as `provider/model`. This is
      # the only variable to change when switching providers — keys for both can
      # stay set, since credentials are looked up by whichever provider this
      # names. Blank keys read as unconfigured, so unused ones are harmless.
      MB_LLM_METABOT_PROVIDER: ${MB_LLM_METABOT_PROVIDER:-anthropic/claude-sonnet-4-6}

      MB_LLM_ANTHROPIC_API_KEY: ${MB_LLM_ANTHROPIC_API_KEY:-}
      MB_LLM_ANTHROPIC_API_BASE_URL: ${MB_LLM_ANTHROPIC_API_BASE_URL:-https://api.anthropic.com}

      MB_LLM_MAX_TOKENS: ${MB_LLM_MAX_TOKENS:-4096}

      MB_LLM_OPENAI_API_KEY: ${MB_LLM_OPENAI_API_KEY:-}
      MB_LLM_OPENAI_API_BASE_URL: ${MB_LLM_OPENAI_API_BASE_URL:-https://api.openai.com}

      # The openai adapter talks to /v1/responses. Gateways that only implement
      # the older /v1/chat/completions therefore cannot serve it at all, whatever
      # model you name. The openrouter adapter speaks chat/completions, so it is
      # the way in for those gateways -- the name refers to the wire format here,
      # not to openrouter.ai.
      MB_LLM_OPENROUTER_API_KEY: ${MB_LLM_OPENROUTER_API_KEY:-}
      MB_LLM_OPENROUTER_API_BASE_URL: ${MB_LLM_OPENROUTER_API_BASE_URL:-https://openrouter.ai/api}
    depends_on:
      metabot-app-db:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    ports:
      - "${METABOT_HOST_PORT:-3000}:3000"

  # Sprint 3: the proactive reporter. Sleeps until 02:00 UTC, scans, and
  # publishes. Started only with `--profile nightly`, so the default `up -d`
  # still brings up just the chat stack.
  #
  # It reaches the warehouse over the Compose network, so host, port and site
  # URL all differ from the values the same scripts use from a laptop -- that
  # difference is the whole reason these are overridden here rather than read
  # from .env.
  nightly:
    profiles: ["nightly"]
    image: python:3.12-slim
    working_dir: /poc/nightly
    command: >
      sh -c "pip install --quiet --no-cache-dir psycopg2-binary &&
             python run_nightly.py --loop --at ${NIGHTLY_AT:-02:00}"
    environment:
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: 5432
      WAREHOUSE_DB: ${WAREHOUSE_DB:-bi_warehouse}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-postgres}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD in dev/metabot-poc/.env}
      METABOT_SITE_URL: http://metabase:3000
      METABOT_ADMIN_EMAIL: ${METABOT_ADMIN_EMAIL:-admin@metabot.local}
      METABOT_ADMIN_PASSWORD: ${METABOT_ADMIN_PASSWORD:?Set METABOT_ADMIN_PASSWORD in dev/metabot-poc/.env}
      MB_LLM_OPENROUTER_API_KEY: ${MB_LLM_OPENROUTER_API_KEY:-}
      MB_LLM_OPENROUTER_API_BASE_URL: ${MB_LLM_OPENROUTER_API_BASE_URL:-https://openrouter.ai/api}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/poc
    depends_on:
      warehouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  metabot_app_db:
  metabot_warehouse:
